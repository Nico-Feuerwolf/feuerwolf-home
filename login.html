<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | FEUERWOLF HOME</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login{width:100%;max-width:420px;background:#1b1b1b;padding:35px;border-radius:14px;border:1px solid #333}
h1{text-align:center;color:#e32636}
p{text-align:center;color:#aaa}
input{width:100%;padding:14px;margin:10px 0;background:#292929;border:1px solid #444;border-radius:7px;color:white}
button{width:100%;padding:14px;background:#e32636;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer;margin-top:12px}
button:hover{background:#bd1d2b}
#message{text-align:center;margin-top:15px;font-size:14px}
a{color:#e32636}
</style>
</head>
<body>
<div class="login">
<h1>FEUERWOLF HOME</h1>
<p>Mitglieder-Login</p>

<form id="loginForm">
<input id="email" type="email" placeholder="E-Mail-Adresse" required>
<input id="password" type="password" placeholder="Passwort" required>
<button type="submit" id="loginButton">Anmelden</button>
</form>

<div id="message"></div>
<p>Noch kein Konto? <a href="register.html">Registrieren</a></p>
<p><a href="index.html">Zurück zur Startseite</a></p>
</div>

<script>
const SUPABASE_URL = "https://oiwtnewzawkerwteatae.supabase.co";
const SUPABASE_KEY = "sb_publishable_17z6ME3aWaJ4ARzcjDAIhg_mVNQTsZN";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  button.disabled = true;
  button.textContent = "Anmeldung läuft...";
  message.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "Anmeldung fehlgeschlagen. Bitte prüfe deine Daten.";
    message.style.color = "#ff7777";
    button.disabled = false;
    button.textContent = "Anmelden";
    return;
  }

  window.location.href = "member.html";
});
</script>
</body>
</html>
