<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEUERWOLF HOME – Inhaberzentrum</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{background:#190909;padding:22px;border-bottom:2px solid #d71920}
header h1{margin:0;color:#ff3038}
main{max-width:1100px;margin:30px auto;padding:20px}
.panel{background:#1c1c1c;border:1px solid #383838;border-radius:12px;padding:22px;margin-bottom:20px}
h2{color:#ff4249}
input{width:100%;padding:13px;background:#292929;color:white;border:1px solid #555;border-radius:7px;margin:10px 0}
button{background:#c81920;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer;margin:5px}
button:hover{background:#ed252d}
.member{padding:14px;background:#292929;border-radius:7px;margin:9px 0}
.muted{color:#aaa}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>FEUERWOLF HOME</h1>
<p>Inhaberzentrum · Mitgliederverwaltung</p>
</header>

<main>
<section class="panel">
<h2>Mitgliederverwaltung</h2>
<p class="muted">Mitglieder suchen und vorhandene Profile anzeigen.</p>
<input id="search" placeholder="Mitglied suchen..." oninput="filterMembers()">
<button onclick="loadMembers()">Aktualisieren</button>
<div id="status">Lade Mitglieder...</div>
<div id="members"></div>
</section>

<section class="panel">
<h2>Inhaberzentrum</h2>
<p>Angemeldet als: <span id="username">Lade...</span></p>
<p>Rolle: <strong id="role">Lade...</strong></p>
<button onclick="logout()">Abmelden</button>
</section>
</main>

<script>
const SUPABASE_URL = "https://oiwtnewzawkerwteatae.supabase.co";
const SUPABASE_KEY = "sb_publishable_17z6ME3aWaJ4ARzcjDAIhg_mVNQTsZN";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let allMembers = [];

async function start(){
  const {data:{session}} = await db.auth.getSession();

  if(!session){
    location.href="login.html";
    return;
  }

  const {data:profile} = await db
    .from("profiles")
    .select("username")
    .eq("id",session.user.id)
    .single();

  document.getElementById("username").textContent =
    profile?.username || session.user.email;

  const {data:roleData,error:roleError} = await db
    .from("member_roles")
    .select("role")
    .eq("user_id",session.user.id)
    .single();

  if(roleError || roleData?.role !== "owner"){
    document.getElementById("status").textContent =
      "Kein Zugriff auf die Mitgliederverwaltung.";
    return;
  }

  document.getElementById("role").textContent = "Projektinhaber";
  loadMembers();
}

async function loadMembers(){
  document.getElementById("status").textContent = "Mitglieder werden geladen...";

  const {data,error} = await db
    .from("profiles")
    .select("id,username,created_at")
    .order("created_at",{ascending:false});

  if(error){
    document.getElementById("status").textContent =
      "Fehler beim Laden: " + error.message;
    return;
  }

  allMembers = data || [];
  showMembers(allMembers);
}

function showMembers(list){
  document.getElementById("status").textContent =
    list.length + " Mitglieder gefunden.";

  document.getElementById("members").innerHTML =
    list.map(member => `
      <div class="member">
        <strong>${escapeHTML(member.username || "Unbekannt")}</strong>
        <p class="muted">Registriert: ${
          member.created_at
            ? new Date(member.created_at).toLocaleDateString("de-DE")
            : "Unbekannt"
        }</p>
      </div>
    `).join("");
}

function filterMembers(){
  const term = document.getElementById("search").value.toLowerCase();

  showMembers(allMembers.filter(member =>
    (member.username || "").toLowerCase().includes(term)
  ));
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

async function logout(){
  await db.auth.signOut();
  location.href="login.html";
}

start();
</script>
</body>
</html>
