<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrieren | FEUERWOLF HOME</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.register{width:100%;max-width:420px;background:#1b1b1b;padding:35px;border-radius:14px;border:1px solid #333}
h1{text-align:center;color:#e32636}
p{text-align:center;color:#aaa}
input{width:100%;padding:14px;margin:10px 0;background:#292929;border:1px solid #444;border-radius:7px;color:white}
button{width:100%;padding:14px;background:#e32636;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer;margin-top:12px}
#message{text-align:center;margin-top:15px;font-size:14px}
a{color:#e32636}
</style>
</head>
<body>
<div class="register">
<h1>FEUERWOLF HOME</h1>
<p>Mitglied werden</p>

<form id="registerForm">
<input id="username" type="text" placeholder="Benutzername" required>
<input id="email" type="email" placeholder="E-Mail-Adresse" required>
<input id="password" type="password" placeholder="Passwort (mindestens 8 Zeichen)" minlength="8" required>
<input id="password2" type="password" placeholder="Passwort wiederholen" minlength="8" required>
<button type="submit" id="registerButton">Konto erstellen</button>
</form>

<div id="message"></div>
<p>Bereits Mitglied? <a href="login.html">Anmelden</a></p>
<p><a href="index.html">Zurück zur Startseite</a></p>
</div>

<script>
const SUPABASE_URL = "https://oiwtnewzawkerwteatae.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_17z6ME3aWaJ4ARzcjDAIhg_mVNQTsZN";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const password2 = document.getElementById("password2").value;

  if (password !== password2) {
    message.textContent = "Die Passwörter stimmen nicht überein.";
    message.style.color = "#ff7777";
    return;
  }

  button.disabled = true;
  button.textContent = "Konto wird erstellt...";
  message.textContent = "";

  const { data, error } = await client.auth.signUp({
    email: email,
    password: password,
    options: {
      data: { username: username },
      emailRedirectTo: "https://feuerwolf-home.netlify.app/member.html"
    }
  });

  if (error) {
    message.textContent = "Registrierung fehlgeschlagen: " + error.message;
    message.style.color = "#ff7777";
    button.disabled = false;
    button.textContent = "Konto erstellen";
    return;
  }

  message.textContent = "Konto erstellt! Bitte bestätige deine E-Mail-Adresse über den zugesandten Link.";
  message.style.color = "#7ee787";
  button.textContent = "E-Mail bestätigen";
});
</script>
</body>
</html>
